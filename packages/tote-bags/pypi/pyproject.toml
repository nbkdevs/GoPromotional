[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gopromotional-packlist"
version = "1.0.1"
description = "Packing checklists with templates, per-night quantities and a Markdown format."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GoPromotional" }]
requires-python = ">=3.9"
keywords = ["packing-list", "checklist", "travel", "markdown", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://www.gopromotional.co.uk/branded-products/tote-bags"
Repository = "https://github.com/nbkdevs/GoPromotional"
Issues = "https://github.com/nbkdevs/GoPromotional/issues"

[project.scripts]
gopromotional-packlist = "gopromotional_packlist.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
