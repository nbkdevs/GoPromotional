[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gopromotional-mugday"
version = "1.0.0"
description = "Caffeine tracker with half-life estimate, sleep-ready time and reusable-cup stats."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GoPromotional" }]
requires-python = ">=3.9"
keywords = ["caffeine", "coffee", "tracker", "health", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://www.gopromotional.co.uk/branded-products/travel-mugs"
Repository = "https://github.com/nbkdevs/GoPromotional"
Issues = "https://github.com/nbkdevs/GoPromotional/issues"

[project.scripts]
gopromotional-mugday = "gopromotional_mugday.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
